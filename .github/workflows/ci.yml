name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（无运行时依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: 单元测试（口径 / 互斥 / 快照可复现 / 对账）
        run: pytest
      - name: 报告数字对账
        run: grid-bottleneck verify
      - name: 快照必须能逐字节复算
        run: |
          grid-bottleneck subtopics --out /tmp/regen.csv > /dev/null
          diff <(tail -n +2 data/subtopic_report.csv) <(tail -n +2 /tmp/regen.csv)
